# Targeted scan — bypasses subdomain enumeration by listing exact hosts.
# Useful for quick tests or scanning specific known subdomains.

client: targeted

targets:
  - testphp.vulnweb.com
  - testhtml5.vulnweb.com

# Skip subfinder/crts/dns — we already know the hosts.
modules:
  - nmap
  - httpx
  - tls
  - waf
  - nuclei

output:
  dir: reports/targeted
  format: json
  keep_history: false

alerts:
  fail_on: ""
